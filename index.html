<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" id="form">
        <label for="username">Name:</label>
        <input type="text" name="name" id="username" placeholder="Enter your name"><br><br>
        <label for="email">Email:</label>
<input type="email" id="email" placeholder="Enter your email"> <br><br>
        <label for="password">Password:</label>
<input type="password" id="password" placeholder="Enter your password"><br><br>
        <button type="submit">Submit</button>
<p></p>
<label for="programming-language">Select Language:</label>
<select name="language" id="programming-language">
<option value="HTML">HTML</option>
<option value="CSS">CSS</option>
<option value="JavaScript">JavaScript</option>
</select>
    </form>

    <script src="index.js"></script>
</body>

</html>
